name: README screenshots
on:
  pull_request:
    paths:
      - 'docs/screenshots/**'
      - '.github/workflows/readme-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser and Chinese system fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture current app
        env:
          SCREENSHOT_OUTPUT: screenshot-output
        run: node docs/screenshots/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-screenshots
          path: screenshot-output/
          retention-days: 14
