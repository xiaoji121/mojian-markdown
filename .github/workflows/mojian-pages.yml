name: Deploy mojian.uk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojian-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the repository's stable npm setup
        run: |
          npm install -g npm@11.12.1
          npm config set registry https://registry.npmmirror.com
          npm config set replace-registry-host always
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check default build and legacy landing URLs
        run: |
          npm run check
          node scripts/check-landing-build.mjs
      - name: Build custom-domain site
        env:
          MOJIAN_SITE_ORIGIN: https://mojian.uk
          MOJIAN_SITE_BASE: /
        run: |
          npm run build
          node scripts/check-landing-build.mjs
      - name: Install browser and fonts
        run: npx playwright install --with-deps chromium
      - name: Verify built four-language site
        env:
          MOJIAN_SITE_ORIGIN: https://mojian.uk
          MOJIAN_SITE_BASE: /
        run: npx playwright test --config playwright.landing.config.ts
      - name: Record deployed source and sitemap
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          writeFileSync('dist/deployment.json', JSON.stringify({ source: process.env.GITHUB_SHA, site: 'https://mojian.uk/' }));
          appendFileSync('dist/robots.txt', '\nSitemap: https://mojian.uk/sitemap.xml\n');
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
