# 桌面端打包配置。前端依赖已打进 dist；Agent Bridge 仍依赖 undici。
# 保留 electron-builder 默认的生产依赖收集，避免漏掉运行时模块。
appId: com.yuxizhai.mojian-markdown
productName: 墨笺 Markdown
directories:
  output: release
files:
  - desktop/**
  - dist/**
  - scripts/agent-bridge*.js
  - package.json
npmRebuild: false
fileAssociations:
  - ext: md
    name: Markdown
    role: Editor
  - ext: markdown
    name: Markdown
    role: Editor
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
